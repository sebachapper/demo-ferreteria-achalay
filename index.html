<style>
  @keyframes pulse {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 700ms cubic-bezier(.22,.61,.36,1) both; }

  @media (max-width: 880px) {
    .v2-hero-grid { grid-template-columns: 1fr !important; }
    .v2-trust-grid { grid-template-columns: repeat(2, 1fr) !important; row-gap: 32px !important; }
    .v2-trust-grid > div { border-left: none !important; padding: 0 !important; }
    .v2-cat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .v2-cat-grid > a:first-child { grid-column: span 2 !important; grid-row: span 1 !important; }
    .v2-about-grid { grid-template-columns: 1fr !important; }
    .v2-about-left { position: static !important; }
    .v2-rev-layout { grid-template-columns: 1fr !important; }
    .v2-rev-quotes { grid-template-columns: 1fr !important; }
    .v2-ctc-layout { grid-template-columns: 1fr !important; }
    .v2-ctc-row { grid-template-columns: 1fr 1fr !important; }
    .v2-ft-inner { grid-template-columns: 1fr !important; gap: 32px !important; }
    .v2-ft-bottom { flex-direction: column; gap: 8px; text-align: center; }
    .v2-nav { grid-template-columns: 1fr auto !important; }
    .v2-nav-links { display: none !important; }
    .v2-ticker { font-size: 9.5px !important; gap: 8px !important; padding: 6px 12px !important; }
    .v2-score-big { font-size: 110px !important; }
  }
  @media (max-width: 520px) {
    .v2-cat-grid { grid-template-columns: 1fr !important; }
    .v2-cat-grid > a:first-child { grid-column: span 1 !important; }
    .v2-trust-grid { grid-template-columns: 1fr !important; }
    .v2-ctc-row { grid-template-columns: 1fr !important; }
    .v2-rev-quotes { grid-template-columns: 1fr !important; }
  }
</style>
