<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Fondo círculo -->
  <circle cx="120" cy="120" r="117" fill="#FDFCF8"/>
  <!-- Anillo exterior -->
  <circle cx="120" cy="120" r="117" fill="none" stroke="#1565A8" stroke-width="3"/>
  <!-- Anillo interior -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="#1565A8" stroke-width="1"/>

  <!-- Badge "Desde 1961" arriba -->
  <circle cx="120" cy="26" r="22" fill="#F07820"/>
  <text x="120" y="22" text-anchor="middle" fill="white" font-family="'Inter', Arial, sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.5">Desde</text>
  <text x="120" y="36" text-anchor="middle" fill="white" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="700">1961</text>

  <!-- Arco superior decorativo -->
  <path d="M 48 100 Q 120 82 192 100" fill="none" stroke="#1565A8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- FERRETERÍA -->
  <text x="120" y="120" text-anchor="middle" fill="#1565A8" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="5">FERRETERÍA</text>

  <!-- ACHALAY -->
  <text x="120" y="155" text-anchor="middle" fill="#F07820" font-family="'Inter', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="1">ACHALAY</text>

  <!-- Arco inferior decorativo -->
  <path d="M 48 165 Q 120 183 192 165" fill="none" stroke="#1565A8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Badge "En Pocitos" abajo -->
  <rect x="70" y="180" width="100" height="20" rx="10" fill="#1565A8"/>
  <text x="120" y="194" text-anchor="middle" fill="white" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3">EN POCITOS</text>
</svg>
